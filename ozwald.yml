---
hosts:
  - name: daneel
    ip: 192.168.0.214

provisioners:
  - name: daneel
    host: daneel
    cache:
      type: redis
      parameters:
        host: daneel
        port: 6479
        db: 0

services:
  - service_name: qwen1.5-vllm
    type: vllm-openai-compat
    description: DeepSeek Qwen 1.5B
    parameters:
      model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    profiles:
      - name: embed
        parameters:
          gpu: True
          cpu_offload_gb: None
          gpu_memory_utilization: 0.7
          max_model_len: 1100
      - name: fast-gpu
        parameters:
          gpu: True
          cpu_offload_gb: None
          gpu_memory_utilization: 0.9
      - name: max-context-window
        parameters:
          max_model_len: None
      - name: small-context-window
        parameters:
          max_model_len: 15000
